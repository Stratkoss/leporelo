name: Leporelo
options:
  bundleIdPrefix: com.stratkoss
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: cs
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
packages:
  Leporelo:
    path: ..
targets:
  Leporelo:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Leporelo/Sources
      - path: Leporelo/Resources
        excludes:
          - AppIcon-source.jpg
          - Info.plist
          - Leporelo.entitlements
    dependencies:
      - package: Leporelo
        product: LeporeloCore
    settings:
      base:
        PRODUCT_NAME: Leporelo
        PRODUCT_BUNDLE_IDENTIFIER: com.stratkoss.leporelo
        INFOPLIST_FILE: Leporelo/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Leporelo/Resources/Leporelo.entitlements
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  LeporeloTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: LeporeloTests
    dependencies:
      - target: Leporelo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stratkoss.leporelo.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Leporelo.app/Contents/MacOS/Leporelo"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Leporelo:
    build:
      targets:
        Leporelo: all
        LeporeloTests: [test]
    test:
      targets:
        - LeporeloTests
